<div class="spinner"></div>
<div id="statusText">Menghubungkan ke server...</div>

<script>
    // Kredensial Supabase Anda
    const supabaseUrl = 'https://heaedfjyjpfvpddtgjhk.supabase.co';
    const supabaseKey = 'sb_publishable_uuIu1DiiNhS4aHc3ZSxqrg_F4punPvO';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function loadAppContent() {
        try {
            document.getElementById('statusText').innerText = "Mengunduh tampilan terbaru...";

            // Mengambil data dari tabel app_settings
            const { data, error } = await supabase
                .from('app_settings')
                .select('html_content')
                .eq('id', 1)
                .single();

            if (error) throw error;

            if (data && data.html_content) {
                // Mengganti seluruh isi halaman ini dengan HTML dari Admin Kontrol
                document.open();
                document.write(data.html_content);
                document.close();
            } else {
                document.getElementById('statusText').innerText = "Tampilan belum diatur di Admin Kontrol.";
            }
        } catch (err) {
            console.error(err);
            document.getElementById('statusText').innerText = "Gagal terhubung: " + err.message;
        }
    }

    // Jalankan fungsi saat aplikasi dibuka
    window.onload = loadAppContent;
</script>
